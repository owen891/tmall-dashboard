app:
  host: "127.0.0.1"
  port: 5000
  debug: false

data:
  db_path: "data/dashboard.db"
  watch_folder: "~/Downloads/tmall_data/"
  backup_folder: "data/backups/"
  backup_on_import: true
  # 保留策略：单份备份约 3.3GB。
  # 原值 30 份 ≈ 75GB；2026-09-20 收紧到 4，2026-10-08 应要求再收紧到 1。
  max_backups: 1
  max_backup_total_gb: 20

thresholds:
  refund_warning: 0.20
  refund_consecutive_weeks: 2
  anomaly_decline: 0.20
  ppc_warning: null
  health_warning: 40

health_score_weights:
  sales: 0.25
  conversion: 0.20
  roi: 0.15
  refund: 0.15
  growth: 0.10
  review: 0.15

refresh:
  auto_refresh_interval: 300
