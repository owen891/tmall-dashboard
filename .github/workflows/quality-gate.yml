name: Quality Gate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python, UI, and browser contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        python: ['3.14']
        node: ['24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install isolated gate dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix desktop
          python scripts/gate_browser_install.py
      - name: Run shared release gate manifest
        shell: bash
        run: python scripts/run_quality_gates.py --tier release --log-dir "$RUNNER_TEMP/tmall-gate-logs"
      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/tmall-gate-logs
          if-no-files-found: ignore
