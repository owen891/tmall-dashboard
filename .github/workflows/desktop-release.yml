name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag and VERSION
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref }}
      - id: version
        name: Require tag to match VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$tag" = "$version" || { echo "Tag v$tag does not match VERSION $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  build-windows:
    needs: validate-release
    if: needs.validate-release.result == 'success'
    runs-on: windows-latest
    env:
      # Windows runners default stdout to cp1252; scripts that print Chinese
      # log text would raise UnicodeEncodeError while merely reporting a result.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.14', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Install dependencies and browser
        shell: bash
        run: |
          python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
          npm ci --prefix desktop
          npx --prefix desktop playwright install --with-deps chromium
      - name: Audit python unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-logs
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee audit-logs/unittest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 以 annotations 形式公开失败测试名（::error:: 会出现在 run 摘要，无需管理员权限）
            grep -E '^(FAIL|ERROR):' audit-logs/unittest.log | head -20 | while read -r line; do
              echo "::error::${line}"
            done
            tail -40 audit-logs/unittest.log | while read -r line; do echo "::warning::${line}"; done
          fi
          exit "$status"
      - name: Upload audit log when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ runner.os }}
          path: audit-logs/unittest.log
          if-no-files-found: warn
      - name: Audit UI demos and visual system
        shell: bash
        run: node scripts/validate_ui_demos.cjs
      - name: Audit production preflight
        shell: bash
        run: python scripts/production_preflight.py
      - name: Audit desktop tests
        shell: bash
        run: npm test --prefix desktop
      - name: Audit desktop build
        shell: bash
        run: npm run build --prefix desktop
      - name: Audit clean tree after build
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
      - name: Build Windows package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_desktop.ps1 -SkipInstall -SkipPythonTests
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml

  build-macos:
    needs: validate-release
    if: needs.validate-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Windows runners default stdout to cp1252; scripts that print Chinese
      # log text would raise UnicodeEncodeError while merely reporting a result.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.14', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Install dependencies and browser
        shell: bash
        run: |
          python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
          npm ci --prefix desktop
          npx --prefix desktop playwright install --with-deps chromium
      - name: Audit python unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-logs
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee audit-logs/unittest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 以 annotations 形式公开失败测试名（::error:: 会出现在 run 摘要，无需管理员权限）
            grep -E '^(FAIL|ERROR):' audit-logs/unittest.log | head -20 | while read -r line; do
              echo "::error::${line}"
            done
            tail -40 audit-logs/unittest.log | while read -r line; do echo "::warning::${line}"; done
          fi
          exit "$status"
      - name: Upload audit log when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ runner.os }}
          path: audit-logs/unittest.log
          if-no-files-found: warn
      - name: Audit UI demos and visual system
        shell: bash
        run: node scripts/validate_ui_demos.cjs
      - name: Audit production preflight
        shell: bash
        run: python scripts/production_preflight.py
      - name: Audit desktop tests
        shell: bash
        run: npm test --prefix desktop
      - name: Audit desktop build
        shell: bash
        run: npm run build --prefix desktop
      - name: Audit clean tree after build
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
      - name: Configure macOS signing identity
        id: signing
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::MAC_CERT_P12 未配置，本次构建退回 ad-hoc 签名（有 bundle 封印、无公证）"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MAC_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MAC_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"
      - name: Build macOS package
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_ADHOC: ${{ steps.signing.outputs.has_cert == 'true' && '0' || '1' }}
        run: |
          python scripts/sync_desktop_version.py
          python scripts/build_backend.py
          # 无证书时 MAC_ADHOC=1 → desktop/scripts/dist-mac.cjs 换用 overlay 配置
          # 把 mac.identity 钉成 "-" 做 ad-hoc 签名。不要用 CLI 的 dot-notation
          # 覆盖（config.mac.identity）：yargs 会把值当 config 路径，报 ENOENT。
          npm run dist:mac --prefix desktop -- --${{ matrix.arch }}
      - name: Verify macOS signature and notarization
        shell: bash
        env:
          HAS_CERT: ${{ steps.signing.outputs.has_cert }}
        run: |
          # electron-builder 对默认架构(x64)写 release/mac，非默认架构写 release/mac-<arch>。
          # 这里按目录匹配，避免把 -x64 后缀写死导致找不到 bundle。
          app_dir=$(ls -d desktop/release/mac* | head -n 1)
          echo "验签目录: $app_dir"
          python scripts/verify_mac_release.py "$app_dir" --require-developer-id "$HAS_CERT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml

  publish:
    needs: [validate-release, build-windows, build-macos]
    if: needs.validate-release.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.14', cache: pip }
      - name: Install metadata tools
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: '*', path: release-artifacts, merge-multiple: false }
      - name: Merge macOS updater metadata
        shell: bash
        run: |
          mkdir -p mac-release
          python scripts/merge_mac_update_metadata.py release-artifacts/mac-x64/latest-mac.yml release-artifacts/mac-arm64/latest-mac.yml --output mac-release/latest-mac.yml
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -exec cp {} mac-release/ \;
          cp release-artifacts/windows-release/* mac-release/ 2>/dev/null || true
      - name: Build release notes from CHANGELOG
        shell: bash
        run: python scripts/write_release_body.py release-body.md
      - name: Publish one serialized GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            mac-release/*.exe
            mac-release/*.dmg
            mac-release/*.zip
            mac-release/*.blockmap
            mac-release/latest.yml
            mac-release/latest-mac.yml
