name: Windows Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build installer and updater metadata
        shell: powershell
        run: ./scripts/build_desktop.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tmall-dashboard-windows-x64
          path: |
            desktop/release/TmallDashboard-Setup-*-x64.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/TmallDashboard-Setup-*-x64.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
