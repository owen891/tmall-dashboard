<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生命周期 | 天猫数据仪表盘</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/shell.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body data-page="lifecycle">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <div class="demo-page__intro">
          <div>
            <h2>生命周期</h2>
            <p>当前项目数据库快照 · 2025-01 至 2026-03 · 按商品追踪月度经营表现。</p>
          </div>
          <div class="demo-page__actions">
            <span class="badge badge--success"><i data-lucide="database"></i>10,552 条月度记录</span>
            <button class="button"><i data-lucide="download"></i>导出生命周期数据</button>
          </div>
        </div>

        <section class="metric-grid" aria-label="生命周期概览">
          <article class="metric-card">
            <div class="metric-card__label">跟踪商品</div>
            <div class="metric-card__value">1,703</div>
            <div class="metric-card__meta"><i data-lucide="package-search"></i>当前数据库全部商品</div>
          </article>
          <article class="metric-card">
            <div class="metric-card__label">累计 GSV</div>
            <div class="metric-card__value">¥2,040.2万</div>
            <div class="metric-card__meta"><i data-lucide="calendar-range"></i>覆盖 15 个月</div>
          </article>
          <article class="metric-card">
            <div class="metric-card__label">平均活跃月数</div>
            <div class="metric-card__value">6.2</div>
            <div class="metric-card__meta"><i data-lucide="activity"></i>按有月度记录统计</div>
          </article>
          <article class="metric-card">
            <div class="metric-card__label">最近月增长商品</div>
            <div class="metric-card__value">130</div>
            <div class="metric-card__meta is-up"><i data-lucide="trending-up"></i>2026-03 环比增长超过 5%</div>
          </article>
        </section>

        <section class="lifecycle-list" data-lifecycle-list>
          <div class="section-toolbar lifecycle-list__toolbar">
            <div class="filter-group">
              <input class="input" type="search" data-lifecycle-search aria-label="搜索生命周期商品" placeholder="搜索商品名称 / 商品 ID">
              <select class="select" data-lifecycle-tier aria-label="商品分层">
                <option value="">全部分层</option>
                <option>利润款</option>
                <option>引流款</option>
                <option>爆款</option>
                <option>形象款</option>
                <option>未分层</option>
              </select>
            </div>
            <span class="panel__hint" role="status" data-lifecycle-count>显示数据库累计 GSV 前 6 款商品</span>
          </div>
          <div class="lifecycle-grid" data-lifecycle-grid></div>
        </section>

        <section class="lifecycle-detail" data-lifecycle-detail hidden>
          <div class="lifecycle-detail__header">
            <div class="lifecycle-detail__product">
              <img data-detail-image src="" alt="">
              <div>
                <h3 class="panel__title" data-detail-title>商品生命周期详情</h3>
                <p class="panel__hint" data-detail-meta></p>
                <div class="lifecycle-detail__id" data-detail-id></div>
              </div>
            </div>
            <button class="button" type="button" data-lifecycle-back><i data-lucide="arrow-left"></i>返回商品列表</button>
          </div>

          <div class="lifecycle-metrics" data-lifecycle-metrics></div>

          <div class="lifecycle-chart-grid">
            <article class="chart-panel panel lifecycle-chart-panel">
              <div class="panel__header">
                <div>
                  <h3 class="panel__title">经营规模</h3>
                  <p class="panel__hint">月度 GSV 与支付件数</p>
                </div>
              </div>
              <div class="chart-box lifecycle-chart-box"><canvas id="lifecycleScaleChart"></canvas></div>
            </article>
            <article class="chart-panel panel lifecycle-chart-panel">
              <div class="panel__header">
                <div>
                  <h3 class="panel__title">售后与投放</h3>
                  <p class="panel__hint">退款金额、推广花费与效率指标</p>
                </div>
                <div class="segmented" role="group" aria-label="效率指标">
                  <button type="button" data-efficiency-mode="refundRate" aria-pressed="true">退款率</button>
                  <button type="button" data-efficiency-mode="roi" aria-pressed="false">ROI</button>
                </div>
              </div>
              <div class="chart-box lifecycle-chart-box"><canvas id="lifecycleEfficiencyChart"></canvas></div>
            </article>
          </div>

          <div class="lifecycle-insights" data-lifecycle-insights aria-label="最近月经营结论"></div>
        </section>
      </main>
    </div>
  </div>

    const list = document.querySelector('[data-lifecycle-list]');
    const detail = document.querySelector('[data-lifecycle-detail]');
    const grid = document.querySelector('[data-lifecycle-grid]');
    const search = document.querySelector('[data-lifecycle-search]');
    const tierFilter = document.querySelector('[data-lifecycle-tier]');
    const count = document.querySelector('[data-lifecycle-count]');
    const periodRange = document.querySelector('[data-period-range]');
    let selectedRecord = null;
    let scaleChart = null;
    let efficiencyChart = null;
    let efficiencyMode = 'refundRate';

    if (periodRange) periodRange.textContent = '2025-01 ~ 2026-03';
    document.querySelectorAll('[data-period]').forEach((button) => button.setAttribute('aria-pressed', 'false'));
    document.querySelectorAll('[data-dim]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.dim === 'month')));

    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    const sum = (values) => values.reduce((total, value) => total + (Number(value) || 0), 0);
    const moneyWan = (value) => `¥${(value / 10000).toLocaleString('zh-CN', { maximumFractionDigits: 1 })}万`;
    const number = (value) => Number(value || 0).toLocaleString('zh-CN', { maximumFractionDigits: 1 });
    const percent = (value) => `${(Number(value || 0) * 100).toFixed(1)}%`;
    const changeRate = (current, previous) => previous ? (current - previous) / previous : 0;
    const toneForChange = (change) => change > .05 ? 'is-up' : change < -.05 ? 'is-down' : '';
    const tierBadge = (tier) => tier === '利润款' ? 'badge--success' : tier === '引流款' ? 'badge--info' : tier === '爆款' ? 'badge--warning' : tier === '形象款' ? 'badge--purple' : 'badge--muted';

    function renderCards() {
      const query = search.value.trim().toLowerCase();
      const tier = tierFilter.value;
      const matches = Object.values(records).filter((record) => {
        const searchable = `${record.title} ${record.id}`.toLowerCase();
        return (!query || searchable.includes(query)) && (!tier || record.tier === tier);
      });
      grid.innerHTML = matches.map((record) => {
        const gsv = record.series.map((row) => row[1]);
        const last = gsv.at(-1) || 0;
        const previous = gsv.at(-2) || 0;
        const change = changeRate(last, previous);
        const trend = change > .05 ? `↑ ${percent(change)}` : change < -.05 ? `↓ ${percent(Math.abs(change))}` : `— ${percent(Math.abs(change))}`;
        return `<button type="button" class="lifecycle-card" data-lifecycle-card="${record.id}">
          <span class="lifecycle-card__header">
            <img src="${record.image}" alt="" referrerpolicy="no-referrer">
            <span>
              <span class="lifecycle-card__title">${escapeHtml(record.title)}</span>
              <span class="lifecycle-card__meta"><span class="badge ${tierBadge(record.tier)}">${record.tier}</span><span class="badge badge--muted">${record.style}</span></span>
            </span>
          </span>
          <span class="lifecycle-card__stats">
            <span class="lifecycle-card__stat"><strong>${moneyWan(sum(gsv))}<span class="lifecycle-card__trend ${toneForChange(change)}">${trend}</span></strong><span>累计 GSV / 最近月环比</span></span>
            <span class="lifecycle-card__stat"><strong>${record.series.length}</strong><span>活跃月数</span></span>
            <span class="lifecycle-card__stat"><strong>${record.series[0][0]} ~ ${record.series.at(-1)[0]}</strong><span>统计周期</span></span>
          </span>
        </button>`;
      }).join('');
      count.textContent = matches.length ? `显示数据库累计 GSV 前 ${matches.length} 款商品` : '无匹配商品';
      grid.querySelectorAll('[data-lifecycle-card]').forEach((card) => card.addEventListener('click', () => showDetail(card.dataset.lifecycleCard)));
    }

    function renderMetrics(record) {
      const gsv = record.series.map((row) => row[1]);
      const qty = record.series.map((row) => row[2]);
      const refunds = record.series.map((row) => row[3]);
      const ad = record.series.map((row) => row[4]);
      const conversions = record.series.map((row) => row[6]);
      const positiveRoi = record.series.map((row) => row[7]).filter((value) => value > 0);
      const latestChange = changeRate(gsv.at(-1), gsv.at(-2));
      const metrics = [
        ['累计 GSV', moneyWan(sum(gsv))],
        ['最近月 GSV', moneyWan(gsv.at(-1))],
        ['最近月环比', `${latestChange >= 0 ? '+' : ''}${percent(latestChange)}`],
        ['累计销量', `${number(sum(qty))} 件`],
        ['累计退款率', percent(sum(refunds) / Math.max(sum(gsv), 1))],
        ['平均转化率', percent(sum(conversions) / conversions.length)],
        ['累计推广费', moneyWan(sum(ad))],
        ['平均 ROI', positiveRoi.length ? (sum(positiveRoi) / positiveRoi.length).toFixed(2) : '--']
      ];
      document.querySelector('[data-lifecycle-metrics]').innerHTML = metrics.map(([label, value]) => `<div class="lifecycle-metric"><strong title="${value}">${value}</strong><span>${label}</span></div>`).join('');
    }

    function chartBase() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { color: '#6b7280', boxWidth: 10, font: { size: 10 } } } },
        scales: { x: { grid: { display: false }, ticks: { color: '#6b7280', maxRotation: 0, autoSkip: true, maxTicksLimit: 8, font: { size: 9 } } } }
      };
    }

    function renderScaleChart(record) {
      if (scaleChart) scaleChart.destroy();
      const labels = record.series.map((row) => row[0]);
      const options = chartBase();
      options.scales.y = { beginAtZero: true, grid: { color: '#e5e7eb' }, ticks: { color: '#6b7280', callback: (value) => `${value}万`, font: { size: 9 } } };
      options.scales.y1 = { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#16a34a', font: { size: 9 } } };
      scaleChart = new Chart(document.getElementById('lifecycleScaleChart'), {
        type: 'bar',
        data: { labels, datasets: [
          { type: 'line', label: 'GSV（万）', data: record.series.map((row) => row[1] / 10000), borderColor: '#2563eb', backgroundColor: 'rgb(37 99 235 / .10)', fill: true, tension: .32, pointRadius: 2, borderWidth: 2, yAxisID: 'y' },
          { type: 'bar', label: '支付件数', data: record.series.map((row) => row[2]), backgroundColor: 'rgb(22 163 74 / .52)', borderRadius: 3, maxBarThickness: 20, yAxisID: 'y1' }
        ] },
        options
      });
    }

    function renderEfficiencyChart(record) {
      if (efficiencyChart) efficiencyChart.destroy();
      const labels = record.series.map((row) => row[0]);
      const isRefund = efficiencyMode === 'refundRate';
      const lineValues = isRefund ? record.series.map((row) => row[1] ? row[3] / row[1] : 0) : record.series.map((row) => row[7]);
      const options = chartBase();
      options.scales.y = { beginAtZero: true, grid: { color: '#e5e7eb' }, ticks: { color: '#6b7280', callback: (value) => `${value}万`, font: { size: 9 } } };
      options.scales.y1 = { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: isRefund ? '#dc2626' : '#d97706', callback: (value) => isRefund ? `${(value * 100).toFixed(0)}%` : Number(value).toFixed(1), font: { size: 9 } } };
      efficiencyChart = new Chart(document.getElementById('lifecycleEfficiencyChart'), {
        type: 'bar',
        data: { labels, datasets: [
          { label: '退款金额（万）', data: record.series.map((row) => row[3] / 10000), backgroundColor: 'rgb(220 38 38 / .52)', borderRadius: 3, maxBarThickness: 18, yAxisID: 'y' },
          { label: '推广花费（万）', data: record.series.map((row) => row[4] / 10000), backgroundColor: 'rgb(37 99 235 / .42)', borderRadius: 3, maxBarThickness: 18, yAxisID: 'y' },
          { type: 'line', label: isRefund ? '退款率' : 'ROI', data: lineValues, borderColor: isRefund ? '#dc2626' : '#d97706', backgroundColor: isRefund ? '#dc2626' : '#d97706', tension: .32, pointRadius: 2, borderWidth: 2, yAxisID: 'y1' }
        ] },
        options
      });
    }

    function renderInsights(record) {
      const current = record.series.at(-1);
      const previous = record.series.at(-2);
      const gsvChange = changeRate(current[1], previous[1]);
      const currentRefundRate = current[1] ? current[3] / current[1] : 0;
      const previousRefundRate = previous[1] ? previous[3] / previous[1] : 0;
      const refundChange = currentRefundRate - previousRefundRate;
      const roi = current[7];
      const adRatio = current[1] ? current[4] / current[1] : 0;
      const insights = [
        [gsvChange >= 0 ? 'success' : 'danger', `${current[0]} GSV ${gsvChange >= 0 ? '回升' : '下降'}`, `${gsvChange >= 0 ? '+' : ''}${percent(gsvChange)}，当前 ${moneyWan(current[1])}`],
        [refundChange <= 0 ? 'success' : 'danger', `退款率 ${refundChange <= 0 ? '改善' : '上升'}`, `${percent(previousRefundRate)} → ${percent(currentRefundRate)}`],
        [roi >= 3 ? 'success' : roi > 0 ? 'warning' : '', '最近月 ROI', roi > 0 ? `${roi.toFixed(2)} · ${roi >= 3 ? '高于安全线 3.0' : '低于安全线 3.0'}` : '当前月无推广数据'],
        [adRatio <= .2 ? 'success' : 'warning', '推广费比', `${percent(adRatio)} · 推广花费 ${moneyWan(current[4])}`]
      ];
      document.querySelector('[data-lifecycle-insights]').innerHTML = insights.map(([tone, title, text]) => `<div class="lifecycle-insight ${tone ? `lifecycle-insight--${tone}` : ''}"><strong>${title}</strong><span>${text}</span></div>`).join('');
    }

    function showDetail(id) {
      const record = records[id];
      if (!record) return;
      selectedRecord = record;
      list.hidden = true;
      detail.hidden = false;
      document.querySelector('[data-detail-title]').textContent = record.title;
      document.querySelector('[data-detail-meta]').textContent = `${record.tier} · ${record.style} · ${record.series.length} 个月数据`;
      document.querySelector('[data-detail-id]').textContent = `商品 ID ${record.id} · ${record.series[0][0]} ~ ${record.series.at(-1)[0]}`;
      const image = document.querySelector('[data-detail-image]');
      image.src = record.image;
      image.alt = record.title;
      image.referrerPolicy = 'no-referrer';
      renderMetrics(record);
      renderInsights(record);
      window.requestAnimationFrame(() => {
        if (selectedRecord !== record || detail.hidden) return;
        renderScaleChart(record);
        renderEfficiencyChart(record);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    search.addEventListener('input', renderCards);
    tierFilter.addEventListener('change', renderCards);
    document.querySelector('[data-lifecycle-back]').addEventListener('click', () => {
      detail.hidden = true;
      list.hidden = false;
      selectedRecord = null;
    });
    document.querySelectorAll('[data-efficiency-mode]').forEach((button) => button.addEventListener('click', () => {
      efficiencyMode = button.dataset.efficiencyMode;
      document.querySelectorAll('[data-efficiency-mode]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      if (selectedRecord) renderEfficiencyChart(selectedRecord);
    }));

    renderCards();
    if (window.lucide) window.lucide.createIcons();
  });
  </script>
</body>
</html>
