<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>关键词选品</title>
  <link rel="stylesheet" href="../assets/tokens.css?v=20261003a">
  <link rel="stylesheet" href="../assets/shell.css?v=20261001j">
  <link rel="stylesheet" href="../assets/components.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/product-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/promotion-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/overview-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/lifecycle-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/settings-domain.css?v=20261001j">
  <link rel="stylesheet" href="../assets/keyword-promotion.css?v=20261001j">
  <script src="../assets/lucide-custom.min.js?v=20261001j"></script>
  <link rel="stylesheet" href="../assets/themes/macos-content.css?v=20261018-regular-titles">
</head>
<body data-page="keyword-promotion">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <div class="ui-page-header">
          <div>
            <h1>关键词选品</h1>
            <p>万相台关键词推广效果复盘 · 数据周期以导入数据为准</p>
            <p class="ui-page-header__scope" data-kp-context-range>正在读取数据范围…</p>
          </div>
          <div class="demo-page__actions">
            <button class="ui-button" type="button" data-kp-reset><i data-lucide="rotate-ccw"></i>重置</button>
          </div>
        </div>

        

        <section class="ui-metric-grid">
          <article class="ui-metric-card"><div class="metric-card__label">商品数</div><div class="metric-card__value" data-kp-kpi="count">--</div></article>
          <article class="ui-metric-card"><div class="metric-card__label">总花费</div><div class="metric-card__value" data-kp-kpi="spend">--</div></article>
          <article class="ui-metric-card"><div class="metric-card__label">总成交</div><div class="metric-card__value" data-kp-kpi="payment">--</div></article>
          <article class="ui-metric-card"><div class="metric-card__label">整体ROI</div><div class="metric-card__value" data-kp-kpi="roi">--</div></article>
          <article class="ui-metric-card"><div class="metric-card__label">平均转化率</div><div class="metric-card__value" data-kp-kpi="cvr">--</div></article>
          <article class="ui-metric-card"><div class="metric-card__label">ROI达标数</div><div class="metric-card__value" data-kp-kpi="roi_ok">--</div></article>
        </section>

        <section class="ui-panel">
          <div class="panel__header product-list__header">
            <div>
              <h3 class="panel__title">推广商品列表</h3>
              <p class="panel__hint" data-kp-status role="status" aria-live="polite">等待加载…</p>
            </div>
            <div class="product-field-controls">
              <div class="segmented" role="group" aria-label="字段模板">
                <button type="button" data-kp-view="promotion" aria-pressed="true">推广效果</button>
                <button type="button" data-kp-view="attribute" aria-pressed="false">商品属性</button>
                <button type="button" data-kp-view="full" aria-pressed="false">全字段</button>
              </div>
              <button class="ui-button" type="button" data-kp-columns-open><i data-lucide="settings-2"></i>列设置</button>
            </div>
          </div>

          <div class="ui-filter-toolbar ui-table-toolbar product-filters">
            <div class="product-filters__main">
              <label class="product-filters__search">
                <span class="sr-only">搜索商品</span>
                <i data-lucide="search" aria-hidden="true"></i>
                <input class="input" data-kp-search placeholder="搜索商品标题或ID…" aria-label="搜索商品" autocomplete="off">
              </label>
              <div class="product-filters__core">
                <select class="select" data-kp-shop-label aria-label="商品类型">
                  
                  <option value="">全部</option>
                  <option value="细分品类A">细分品类A</option>
                  <option value="细分品类B">细分品类B</option>
                  <option value="专业运动系列">专业运动系列</option>
                  <option value="细分品类C">细分品类C</option>
                  <option value="直播">直播</option>
                </select>
                <select class="select" data-kp-category aria-label="品类"><option value="">全部品类</option></select>
                <select class="select" data-kp-gender aria-label="性别"><option value="">全部性别</option></select>
                <select class="select" data-kp-season aria-label="季节"><option value="">全部季节</option></select>
                <select class="select" data-kp-grade aria-label="评级"><option value="">全部评级</option></select>
              </div>
              <div class="product-filters__sort">
                <select class="select" data-kp-sort aria-label="排序字段">
                  <option value="total_score">综合分</option>
                  <option value="roi">ROI</option>
                  <option value="ad_spend">花费</option>
                  <option value="payment_amount">成交</option>
                  <option value="cvr">转化率</option>
                  <option value="ctr">点击率</option>
                  <option value="cart_rate">加购率</option>
                  <option value="organic_visitors">访客数</option>
                  <option value="organic_payment">整体销量</option>
                </select>
                <select class="select" data-kp-order aria-label="排序方向"><option value="desc">降序</option><option value="asc">升序</option></select>
              </div>
            </div>
            <div class="product-filters__actions">
              <button class="ui-button" type="button" data-kp-more-toggle aria-controls="kp-more-filters" aria-expanded="false"><i data-lucide="sliders-horizontal"></i><span>更多筛选</span></button>
            </div>
          </div>

          <div id="kp-more-filters" class="product-filters__advanced" data-kp-more-filters hidden>
            <select class="select" data-kp-material aria-label="材质"><option value="">全部材质</option></select>
            <select class="select" data-kp-scene aria-label="场景"><option value="">全部场景</option></select>
            <select class="select" data-kp-thickness aria-label="厚度"><option value="">全部厚度</option></select>
            <select class="select" data-kp-style aria-label="风格"><option value="">全部风格</option></select>
            <select class="select" data-kp-action aria-label="建议动作"><option value="">全部动作</option></select>
            <label class="product-filters__range">
              <span>最低花费</span>
              <input class="input" type="number" data-kp-min-spend value="5" min="0" placeholder="元">
            </label>
            <label class="product-filters__range">
              <span>最低ROI</span>
              <input class="input" type="number" data-kp-min-roi step="0.1" min="0" placeholder="如1.0">
            </label>
          </div>

          <div class="ui-table-wrap ui-table-wrap--discoverable">
            <table class="ui-data-table product-table" data-table-pagination="server">
              <thead><tr data-kp-head></tr></thead>
              <tbody data-kp-body>
                <tr><td colspan="20">加载中…</td></tr>
              </tbody>
            </table>
          </div>

          <div class="ui-filter-toolbar table-controls table-controls--server" data-kp-pagination>
            <span class="panel__hint table-controls__summary" data-kp-page-summary>--</span>
            <label class="table-controls__page-size">每页
              <select class="select" data-kp-page-size aria-label="每页显示行数">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
              行
            </label>
            <div class="table-controls__nav">
              <button class="ui-button table-controls__button" type="button" data-kp-prev><i data-lucide="chevron-left"></i>上一页</button>
              <button class="ui-button table-controls__button" type="button" data-kp-next>下一页<i data-lucide="chevron-right"></i></button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 列设置弹窗 -->
  <dialog class="modal-form ui-panel ui-field-selector-dialog products-columns-dialog" data-kp-columns-dialog data-modal-kind="config" aria-labelledby="kpColumnsTitle" hidden>
    <div class="modal-form__header">
      <div>
        <h3 id="kpColumnsTitle">列设置</h3>
        <p class="panel__hint">选择推广商品列表中需要展示的字段</p>
      </div>
      <button class="ui-button ui-button--ghost" type="button" data-kp-columns-close aria-label="关闭列设置"><i data-lucide="x"></i></button>
    </div>
    <div class="products-columns-dialog__body">
      <div class="field-template-bar">
        <div class="field-template-bar__current">当前显示 <strong data-kp-visible-count>--</strong> 个字段</div>
        <div class="field-template-bar__controls">
          <select class="select" data-kp-template-select aria-label="选择字段模板">
            <option value="promotion">推广效果</option>
            <option value="attribute">商品属性</option>
            <option value="full">全字段</option>
          </select>
          <button class="ui-button" type="button" data-kp-template-apply>使用模板</button>
          <button class="ui-button" type="button" data-kp-columns-select-all>全选</button>
          <button class="ui-button" type="button" data-kp-columns-clear-all>清空</button>
          <button class="ui-button" type="button" data-kp-columns-reset><i data-lucide="rotate-ccw"></i>恢复推广模板</button>
        </div>
      </div>
      <div data-kp-field-selector></div>
      <div class="products-template-save">
        <input class="input" name="kp_template_name" autocomplete="off" data-kp-template-name placeholder="自定义模板名称" aria-label="自定义模板名称">
        <button class="ui-button" type="button" data-kp-template-save><i data-lucide="save"></i>保存为模板</button>
      </div>
      <div class="saved-template-list field-template-manager" data-kp-template-manager aria-label="字段模板管理"></div>
      <p class="products-columns-dialog__status" data-kp-columns-status aria-live="polite"></p>
    </div>
    <div class="modal-form__footer">
      <button class="ui-button" type="button" data-kp-columns-close>取消</button>
      <button class="ui-button ui-button--primary" type="button" data-kp-columns-apply><i data-lucide="check"></i>应用字段</button>
    </div>
  </dialog>

  <script src="../assets/api.js?v=20261001j"></script>
  <script src="../assets/navigation.js?v=20261011a"></script>
  <script src="../assets/shell.js?v=20261011a"></script>
  <script src="../assets/field-selector.js?v=20261001j"></script>
  <script src="../assets/runtime/date-range-scope.js?v=20261001j"></script><script src="../assets/format.js?v=20261011a"></script><script src="../assets/ui-components.js?v=20261003a"></script><script src="../assets/keyword-promotion-live.js?v=20261003a"></script>
</body>
</html>
