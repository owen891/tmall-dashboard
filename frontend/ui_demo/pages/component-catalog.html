<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组件目录 | 天猫数据仪表盘</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/shell.css">
  <link rel="stylesheet" href="../assets/components.css"><link rel="stylesheet" href="../assets/themes/product-domain.css"><link rel="stylesheet" href="../assets/themes/promotion-domain.css"><link rel="stylesheet" href="../assets/themes/overview-domain.css"><link rel="stylesheet" href="../assets/themes/lifecycle-domain.css"><link rel="stylesheet" href="../assets/themes/settings-domain.css">
  <script src="../assets/lucide-custom.min.js"></script>
</head>
<body data-page="catalog">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <div class="ui-page-header"><div><h2>组件目录</h2><p>公共组件、状态和交互契约预览</p></div><span class="ui-badge ui-badge--info" data-catalog-audit>检查中…</span></div>
        <section class="section-grid">
          <article class="ui-panel"><div class="panel__header"><div><h3 class="panel__title">按钮</h3><p class="panel__hint">统一操作层级和状态</p></div></div><div class="panel__tools"><button class="ui-button">次要操作</button><button class="ui-button ui-button--primary"><i data-lucide="check"></i>主要操作</button><button class="ui-button ui-button--danger">危险操作</button><button class="ui-button ui-button--ghost">幽灵操作</button><button class="ui-button" disabled>禁用</button></div></article>
          <article class="ui-panel"><div class="panel__header"><div><h3 class="panel__title">徽章</h3><p class="panel__hint">统一业务状态色</p></div></div><div class="panel__tools"><span class="ui-badge ui-badge--brand">品牌</span><span class="ui-badge ui-badge--success">成功</span><span class="ui-badge ui-badge--warning">关注</span><span class="ui-badge ui-badge--danger">危险</span><span class="ui-badge ui-badge--info">信息</span></div></article>
        </section>
        <section class="ui-metric-grid"><article class="ui-metric-card ui-metric-card--brand"><div class="ui-metric-card__top"><span class="ui-metric-card__label">净销售额</span><span class="ui-metric-card__icon"><i data-lucide="dollar-sign"></i></span></div><strong class="ui-metric-card__value">128,400</strong><span class="ui-metric-card__meta">较上期 +12.4%</span></article><article class="ui-metric-card"><div class="ui-metric-card__top"><span class="ui-metric-card__label">支付转化率</span><span class="ui-metric-card__icon"><i data-lucide="percent"></i></span></div><strong class="ui-metric-card__value">3.8%</strong><span class="ui-metric-card__meta">等待加载…</span></article></section>
        <section class="ui-panel"><div class="panel__header"><div><h3 class="panel__title">页面组合</h3><p class="panel__hint">新页面优先组合这些结构，不再复制页面私有实现</p></div></div><div class="ui-page-header"><div><h2>页面标题</h2><p>页面说明和当前数据口径</p></div><div class="panel__tools"><button class="ui-button ui-button--primary">主要操作</button></div></div><div class="ui-filter-toolbar"><div class="ui-filter-toolbar__main"><input class="input" placeholder="搜索…" aria-label="搜索"><select class="select" aria-label="筛选"><option>全部状态</option></select></div><button class="ui-button">重置</button></div><div class="ui-table-wrap"><table class="ui-data-table"><thead><tr><th>商品</th><th class="num">销售额</th></tr></thead><tbody><tr><td>示例商品</td><td class="num">12,400</td></tr></tbody></table></div></section>
        <section class="section-grid"><article class="ui-panel"><div class="panel__header"><div><h3 class="panel__title">数据状态</h3><p class="panel__hint">所有数据区域必须使用标准状态，由 TmallUI.dataState 渲染</p></div></div><div class="section-grid" data-catalog-states></div></article></section>
        <section class="section-grid"><article class="ui-panel"><div class="panel__header"><div><h3 class="panel__title">弹窗</h3><p class="panel__hint">TmallUI.modal / TmallUI.confirm：原生 dialog、焦点还原、ESC 与遮罩关闭、滚动锁定</p></div></div><div class="panel__tools"><button class="ui-button" data-catalog-modal="form">表单弹窗</button><button class="ui-button" data-catalog-modal="confirm">确认操作</button><button class="ui-button" data-catalog-modal="danger">危险确认</button><button class="ui-button" data-catalog-modal="static">不可误关弹窗</button><span class="ui-badge" data-catalog-modal-result>等待操作</span></div></article></section>
      </main>
    </div>
  </div>
  <script src="../assets/api.js"></script><script src="../assets/navigation.js"></script><script src="../assets/shell.js"></script><script src="../assets/ui-components.js"></script>
  <script>
    window.addEventListener('load', () => {
      const issues = window.TmallUI?.audit?.() || [];
      const status = document.querySelector('[data-catalog-audit]');
      if (status) status.textContent = issues.length ? `发现 ${issues.length} 个未统一节点` : '组件契约检查通过';
      if (!window.TmallUI) return;
      const stateHost = document.querySelector('[data-catalog-states]');
      if (stateHost) {
        stateHost.append(
          TmallUI.dataState('loading'),
          TmallUI.dataState('no-data'),
          TmallUI.dataState('insufficient-data'),
          TmallUI.dataState('missing-fields', { fields: ['支付金额', '访客数'] }),
          TmallUI.dataState('calculation-failed', { message: '重试将重新计算最近 30 天数据', retry: () => setResult('已重新请求') }),
        );
      }
      const result = document.querySelector('[data-catalog-modal-result]');
      const setResult = (message) => { if (result) result.textContent = message; };
      document.querySelectorAll('[data-catalog-modal]').forEach((trigger) => {
        trigger.addEventListener('click', () => {
          const kind = trigger.dataset.catalogModal;
          if (kind === 'form') {
            const field = document.createElement('label');
            field.textContent = '活动名称';
            const input = document.createElement('input');
            input.className = 'input';
            input.placeholder = '例如：618 预售';
            field.append(input);
            const cancel = TmallUI.button({ label: '取消' });
            const apply = TmallUI.button({ label: '应用', variant: 'primary' });
            const dialog = TmallUI.modal({ title: '表单弹窗', description: 'ESC、遮罩点击与关闭按钮都会触发 onClose', body: field, footer: [cancel, apply], onClose: () => setResult('onClose 已触发') });
            cancel.addEventListener('click', () => dialog.close());
            apply.addEventListener('click', () => { setResult('已应用'); dialog.close(); });
            dialog.open();
          } else if (kind === 'confirm') {
            TmallUI.confirm({ title: '确认操作', message: '确定要应用当前筛选吗？' }).then((ok) => setResult(ok ? '已确认' : '已取消'));
          } else if (kind === 'danger') {
            TmallUI.confirm({ title: '删除确认', message: '删除后不可恢复，是否继续？', confirmLabel: '删除', tone: 'danger' }).then((ok) => setResult(ok ? '已删除' : '已取消'));
          } else if (kind === 'static') {
            const known = TmallUI.button({ label: '我知道了', variant: 'primary' });
            const dialog = TmallUI.modal({ title: '不可误关弹窗', description: 'ESC 与遮罩点击无效，只能通过页脚按钮关闭', body: '适用于必填表单或加载锁定场景。', size: 'lg', dismissible: false, footer: [known], onClose: () => setResult('onClose 已触发') });
            known.addEventListener('click', () => dialog.close());
            dialog.open();
          }
        });
      });
    });
  </script>
</body>
</html>
