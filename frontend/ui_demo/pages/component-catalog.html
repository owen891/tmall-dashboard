<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组件目录 | 天猫数据仪表盘</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/shell.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/lucide-custom.min.js"></script>
</head>
<body data-page="catalog">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <div class="demo-page__intro"><div><h2>组件目录</h2><p>公共组件、状态和交互契约预览</p></div><span class="ui-badge ui-badge--info" data-catalog-audit>检查中…</span></div>
        <section class="section-grid">
          <article class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">按钮</h3><p class="panel__hint">统一操作层级和状态</p></div></div><div class="panel__tools"><button class="ui-button">次要操作</button><button class="ui-button ui-button--primary"><i data-lucide="check"></i>主要操作</button><button class="ui-button ui-button--danger">危险操作</button><button class="ui-button ui-button--ghost">幽灵操作</button><button class="ui-button" disabled>禁用</button></div></article>
          <article class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">徽章</h3><p class="panel__hint">统一业务状态色</p></div></div><div class="panel__tools"><span class="ui-badge ui-badge--brand">品牌</span><span class="ui-badge ui-badge--success">成功</span><span class="ui-badge ui-badge--warning">关注</span><span class="ui-badge ui-badge--danger">危险</span><span class="ui-badge ui-badge--info">信息</span></div></article>
        </section>
        <section class="metric-grid"><article class="ui-metric-card ui-metric-card--brand"><div class="ui-metric-card__top"><span class="ui-metric-card__label">净销售额</span><span class="ui-metric-card__icon"><i data-lucide="dollar-sign"></i></span></div><strong class="ui-metric-card__value">128,400</strong><span class="ui-metric-card__meta">较上期 +12.4%</span></article><article class="ui-metric-card"><div class="ui-metric-card__top"><span class="ui-metric-card__label">支付转化率</span><span class="ui-metric-card__icon"><i data-lucide="percent"></i></span></div><strong class="ui-metric-card__value">3.8%</strong><span class="ui-metric-card__meta">等待加载…</span></article></section>
        <section class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">页面组合</h3><p class="panel__hint">新页面优先组合这些结构，不再复制页面私有实现</p></div></div><div class="ui-page-header"><div><h2>页面标题</h2><p>页面说明和当前数据口径</p></div><div class="panel__tools"><button class="ui-button ui-button--primary">主要操作</button></div></div><div class="ui-filter-toolbar"><div class="ui-filter-toolbar__main"><input class="input" placeholder="搜索…" aria-label="搜索"><select class="select" aria-label="筛选"><option>全部状态</option></select></div><button class="ui-button">重置</button></div><div class="ui-table-wrap"><table class="ui-data-table"><thead><tr><th>商品</th><th class="num">销售额</th></tr></thead><tbody><tr><td>示例商品</td><td class="num">12,400</td></tr></tbody></table></div></section>
        <section class="section-grid"><article class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">数据状态</h3><p class="panel__hint">所有数据区域必须使用标准状态</p></div></div><div class="section-grid"><div class="ui-empty-state" data-state="loading"><strong>加载中…</strong><span>正在读取数据</span></div><div class="ui-empty-state" data-state="no-data"><strong>暂无数据</strong><span>当前筛选条件没有可展示的数据</span></div><div class="ui-empty-state" data-state="calculation-failed"><strong>计算失败</strong><span>请稍后重试</span></div></div></article></section>
      </main>
    </div>
  </div>
  <script src="../assets/api.js"></script><script src="../assets/navigation.js"></script><script src="../assets/shell.js"></script>
  <script>
    window.addEventListener('load', () => {
      const issues = window.TmallUI?.audit?.() || [];
      const status = document.querySelector('[data-catalog-audit]');
      if (status) status.textContent = issues.length ? `发现 ${issues.length} 个未统一节点` : '组件契约检查通过';
    });
  </script>
</body>
</html>
