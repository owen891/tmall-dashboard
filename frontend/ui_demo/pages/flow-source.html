<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流量来源分析 - 天猫数据仪表盘</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/shell.css">
<link rel="stylesheet" href="../assets/components.css">
<script src="../assets/lucide-1.8.0.min.js"></script>
<script src="../assets/echarts-5.5.1.min.js"></script>
<style>
.flow-chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4); }
.flow-chart-box { background: var(--surface-muted); border-radius: var(--radius-md); padding: var(--space-3); min-height: 320px; }
.flow-chart-title { font-size: var(--font-size-secondary); font-weight: 600; color: var(--text-secondary); margin-bottom: var(--space-2); text-align: center; }
.flow-channel-bar { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.flow-channel-label { width: 100px; font-size: var(--font-size-meta); color: var(--text-secondary); text-align: right; flex-shrink: 0; }
.flow-channel-track { flex: 1; height: 24px; background: var(--surface-base); border-radius: var(--radius-sm); overflow: hidden; }
.flow-channel-fill { height: 100%; border-radius: var(--radius-sm); transition: width .3s; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: white; font-size: 11px; font-weight: 600; }
.flow-channel-value { width: 80px; font-size: var(--font-size-meta); font-family: var(--font-mono); color: var(--text-primary); flex-shrink: 0; text-align: right; }
.flow-table-wrap { overflow-x: auto; }
.flow-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-meta); }
.flow-table th { background: var(--surface-muted); padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); white-space: nowrap; }
.flow-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
.flow-table tr:hover { background: var(--surface-hover); }
.flow-table .num { text-align: right; font-family: var(--font-mono); }
.flow-table .pct { text-align: right; font-family: var(--font-mono); color: var(--text-secondary); }
.flow-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.flow-badge--paid { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
.flow-badge--free { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
.flow-badge--other { background: rgba(100, 116, 139, 0.1); color: #64748b; }
@media (max-width: 900px) { .flow-chart-row { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="flow-source">
<div class="demo-app">
  <aside class="demo-sidebar" data-shell-sidebar></aside>
  <div class="demo-main">
    <header class="demo-topbar" data-shell-header></header>
    <main class="demo-page">

      <div class="demo-page__intro">
        <div>
          <h2>流量来源分析</h2>
          <p>生意参谋 · 第一次访问来源口径 · 渠道结构与转化分析</p>
        </div>
        <div class="demo-page__actions">
          <span class="badge badge--info" data-flow-date>--</span>
          <span class="badge badge--success" data-flow-belong>第一次访问来源</span>
        </div>
      </div>

      <!-- 指标卡片 -->
      <section class="metric-grid">
        <article class="metric-card">
          <div class="metric-card__label">总访客数</div>
          <div class="metric-card__value" data-flow-total-uv>--</div>
          <div class="metric-card__meta">所有渠道合计</div>
        </article>
        <article class="metric-card">
          <div class="metric-card__label">总支付金额</div>
          <div class="metric-card__value" data-flow-total-pay>--</div>
          <div class="metric-card__meta">所有渠道合计</div>
        </article>
        <article class="metric-card">
          <div class="metric-card__label">支付买家数</div>
          <div class="metric-card__value" data-flow-total-buyers>--</div>
          <div class="metric-card__meta">所有渠道合计</div>
        </article>
        <article class="metric-card">
          <div class="metric-card__label">整体转化率</div>
          <div class="metric-card__value" data-flow-total-rate>--</div>
          <div class="metric-card__meta">支付买家/访客</div>
        </article>
      </section>

      <!-- 图表区域 -->
      <section class="flow-chart-row">
        <div class="flow-chart-box">
          <div class="flow-chart-title">一级渠道访客占比</div>
          <div id="flowPieChart" style="width:100%;height:280px;"></div>
        </div>
        <div class="flow-chart-box">
          <div class="flow-chart-title">一级渠道支付金额对比</div>
          <div id="flowBarChart" style="width:100%;height:280px;"></div>
        </div>
      </section>

      <!-- 一级渠道详细 -->
      <section class="plain-panel panel">
        <div class="panel__header">
          <div>
            <h3 class="panel__title">一级渠道明细</h3>
            <p class="panel__hint">按访客数排序，展示各渠道核心指标</p>
          </div>
        </div>
        <div class="flow-table-wrap">
          <table class="flow-table">
            <thead>
              <tr>
                <th>渠道名称</th>
                <th>类型</th>
                <th class="num">访客数</th>
                <th class="pct">访客占比</th>
                <th class="num">支付金额</th>
                <th class="num">支付买家</th>
                <th class="pct">支付转化率</th>
                <th class="num">客单价</th>
                <th class="num">UV价值</th>
                <th class="num">加购人数</th>
                <th class="num">新访客</th>
              </tr>
            </thead>
            <tbody data-flow-level1-body>
              <tr><td colspan="11" style="text-align:center;color:var(--text-tertiary);padding:24px">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 二级渠道详细 -->
      <section class="plain-panel panel" style="margin-top: var(--space-4);">
        <div class="panel__header">
          <div>
            <h3 class="panel__title">二级渠道明细</h3>
            <p class="panel__hint">点击一级渠道可筛选对应子渠道</p>
          </div>
          <div class="panel__tools">
            <select class="select" data-flow-parent-filter style="min-width:140px">
              <option value="">全部一级渠道</option>
            </select>
          </div>
        </div>
        <div class="flow-table-wrap">
          <table class="flow-table">
            <thead>
              <tr>
                <th>子渠道</th>
                <th>所属渠道</th>
                <th class="num">访客数</th>
                <th class="pct">访客占比</th>
                <th class="num">支付金额</th>
                <th class="num">支付买家</th>
                <th class="pct">支付转化率</th>
                <th class="num">UV价值</th>
                <th class="num">加购人数</th>
                <th class="num">新访客</th>
              </tr>
            </thead>
            <tbody data-flow-level2-body>
              <tr><td colspan="10" style="text-align:center;color:var(--text-tertiary);padding:24px">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="../assets/api.js"></script>
<script src="../assets/navigation.js"></script>
<script src="../assets/labels.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/flow-source-live.js"></script>
</body>
</html>
