<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周月复盘 | 天猫数据仪表盘</title>
  <link rel="stylesheet" href="../assets/tokens.css?v=20261001j">
  <link rel="stylesheet" href="../assets/shell.css?v=20261001j">
  <link rel="stylesheet" href="../assets/components.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/product-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/promotion-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/overview-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/lifecycle-domain.css?v=20261001j"><link rel="stylesheet" href="../assets/themes/settings-domain.css?v=20261001j">
  <link rel="stylesheet" href="../assets/period-review.css?v=20261002b">
  <script src="../assets/lucide-custom.min.js?v=20261001j"></script>
</head>
<body data-page="period-review">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <aside data-right-rail hidden aria-label="辅助信息"></aside>
        <div class="ui-page-header pr-page-header">
          <div>
            <span class="section-kicker">经营决策工作台</span>
            <h1>周月复盘</h1>
            <p>先确认结果和变化，再定位商品、推广与执行问题，最后沉淀可验收的下一步动作。</p>
          </div>
        </div>

        <section class="ui-context-bar pr-context-bar" aria-label="复盘范围">
          <div class="ui-context-bar__copy">
            <span class="ui-context-bar__label">复盘范围</span>
            <strong class="ui-context-bar__value" data-pr-context-range>正在读取时间范围…</strong>
            <span class="ui-context-bar__meta" data-pr-context-meta>正在读取周期、品类与对比口径…</span>
          </div>
        </section>

        <section class="pr-control-strip" aria-label="legacy controls" hidden>
          <nav class="pr-mode-tabs" aria-label="复盘周期">
            <button type="button" class="is-active" data-pr-mode="week">周复盘</button>
            <button type="button" data-pr-mode="month">月复盘</button>
          </nav>
          <div class="pr-control-strip__status">
            <strong data-pr-period-label>正在读取时间范围…</strong>
          </div>
          <label class="pr-compact-field"><span>对比</span><select data-pr-compare aria-label="对比方式">
            <option value="previous">环比上一期</option>
            <option value="yoy">同比去年同期</option>
            <option value="custom">自定义对比周期</option>
            <option value="none">不对比</option>
          </select></label>
          <label class="pr-compact-field" data-pr-compare-period-field hidden><span>对比周期</span><select data-pr-compare-period aria-label="对比周期"></select></label>
        </section>

        <details class="ui-panel pr-toolbar pr-toolbar--collapsible" aria-label="复盘设置" data-pr-settings>
          <summary class="pr-toolbar__summary">
            <span class="pr-toolbar__summary-title"><i data-lucide="settings-2"></i>复盘设置</span>
            <span class="pr-toolbar__summary-hint">目标 / 复盘人 / 定稿状态</span>
          </summary>
          <div class="pr-toolbar__fields">
            <label class="pr-field"><span>销售额目标（可空）</span><input type="number" min="0" step="100" data-pr-target placeholder="未设置"></label>
            <label class="pr-field"><span>净利润额目标（可空）</span><input type="number" min="0" step="100" data-pr-target-profit placeholder="未设置"></label>
            <label class="pr-field"><span>推广费目标（可空）</span><input type="number" min="0" step="100" data-pr-target-ad-spend placeholder="未设置"></label>
            <label class="pr-field"><span>净费比目标 %（可空）</span><input type="number" min="0" step="0.01" data-pr-target-net-expense-ratio placeholder="如 23.70"></label>
            <label class="pr-field"><span>复盘人</span><input type="text" data-pr-reviewer value="运营人员"></label>
            <label class="pr-field"><span>状态</span><select data-pr-status><option value="draft">草稿</option><option value="final">已定稿</option></select></label>
          </div>
          <p class="pr-toolbar__status" data-pr-status-text role="status"></p>
          <p class="pr-toolbar__status" data-pr-category-note role="status"></p>
        </details>

        <div class="pr-state" data-pr-state role="status" aria-live="polite"></div>

        <section class="pr-command-center" data-pr-command-center hidden aria-label="复盘结论总览"></section>

        <section data-pr-gap-attribution hidden aria-label="目标差距归因"></section>

        <nav class="pr-workbench-tabs" aria-label="复盘工作区">
          <button type="button" class="is-active" data-pr-workbench-tab="conclusion">复盘结论</button>
          <button type="button" data-pr-workbench-tab="diagnosis">拆因分析</button>
          <button type="button" data-pr-workbench-tab="execution">计划与动作</button>
          <button type="button" data-pr-workbench-tab="reference">数据参考</button>
        </nav>

        <section class="pr-workbench-panel is-active" data-pr-workbench-panel="conclusion">
          <section class="ui-panel pr-overview" data-pr-overview hidden aria-label="业绩全景"></section>
          <section class="pr-sections" data-pr-sections aria-label="复盘结论"></section>
        </section>

        <!-- 拆因分析：货品 → 推广 → 市场 递进阅读，一次滚动看完，不再三个 tab 来回跳。 -->
        <section class="pr-workbench-panel" data-pr-workbench-panel="diagnosis">
          <nav class="pr-anchor-chips" aria-label="拆因分节导航">
            <button type="button" data-pr-diagnosis-anchor="products">① 货品与异常</button>
            <button type="button" data-pr-diagnosis-anchor="promotion">② 推广投放</button>
            <button type="button" data-pr-diagnosis-anchor="traffic">③ 流量来源</button>
            <button type="button" data-pr-diagnosis-anchor="market">④ 市场监控</button>
          </nav>
          <h3 class="pr-diagnosis__heading" data-pr-diagnosis-section="products">① 货品与异常</h3>
          <section class="pr-analysis-grid" data-pr-product-analysis aria-label="货品与异常"></section>
          <h3 class="pr-diagnosis__heading" data-pr-diagnosis-section="promotion">② 推广投放</h3>
          <section class="pr-analysis-grid" data-pr-channel-analysis aria-label="推广分析"></section>
          <section class="pr-analysis-grid" data-pr-promotion-analysis aria-label="推广效率"></section>
          <!-- 流量（自家店铺）与市场（外部行业/竞对）是两类诊断，分节不混排。 -->
          <h3 class="pr-diagnosis__heading" data-pr-diagnosis-section="traffic">③ 流量来源</h3>
          <section class="pr-analysis-grid" data-pr-traffic-analysis aria-label="流量来源"></section>
          <h3 class="pr-diagnosis__heading" data-pr-diagnosis-section="market">④ 市场监控</h3>
          <section class="pr-analysis-grid" data-pr-market-analysis aria-label="市场监控"></section>
        </section>

        <section class="pr-workbench-panel" data-pr-workbench-panel="execution">
          <section class="pr-analysis-grid" data-pr-execution-analysis aria-label="计划与动作"></section>
        </section>

        <!-- 数据参考：矩阵 / 类目 / 历史 属查询性质，归并到一个区块。 -->
        <section class="pr-workbench-panel" data-pr-workbench-panel="reference">
          <h3 class="pr-diagnosis__heading">指标矩阵（近周期对比）</h3>
          <section class="pr-analysis-grid" data-pr-matrix aria-label="周期指标矩阵"></section>
          <h3 class="pr-diagnosis__heading">类目拆解</h3>
          <section class="pr-analysis-grid" data-pr-category-breakdown aria-label="类目指标拆解"></section>
          <section class="ui-panel pr-history-panel" aria-label="历史复盘">
            <div class="panel__header">
              <div><h3 class="panel__title">历史复盘</h3><p class="panel__hint">点击任意一期可载入查看或继续编辑。</p></div>
            </div>
            <div class="pr-history__list" data-pr-history></div>
          </section>
        </section>
        <div class="ui-sticky-action-bar pr-action-bar">
          <div class="ui-sticky-action-bar__content" data-pr-action-summary role="status" aria-live="polite">正在读取复盘状态…</div>
          <div class="ui-sticky-action-bar__actions">
            <button type="button" class="ui-button" data-pr-refresh><i data-lucide="refresh-cw"></i><span>刷新素材</span></button>
            <button type="button" class="ui-button" data-pr-export><i data-lucide="download"></i><span>导出复盘</span></button>
            <button type="button" class="ui-button ui-button--primary" data-pr-save><i data-lucide="save"></i><span>保存复盘</span></button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../assets/api.js?v=20261001j"></script>
  <script src="../assets/navigation.js?v=20261001j"></script>
  <script src="../assets/labels.js?v=20261001j"></script>
  <script src="../assets/shell.js?v=20261001j"></script>
  <script src="../assets/format.js?v=20261002a"></script><script src="../assets/ui-components.js?v=20261001j"></script><script src="../assets/field-selector.js?v=20261001j"></script><script src="../assets/metric-polarity.js?v=20261001j"></script><script src="../assets/pages/period-review/product-columns.js?v=20261002b"></script><script src="../assets/pages/period-review/target-cards.js?v=20261002a"></script><script src="../assets/pages/period-review/metric-cards.js?v=20261002a"></script><script src="../assets/pages/period-review/gap-attribution.js?v=20261002a"></script><script src="../assets/pages/period-review/review-export.js?v=20261002a"></script><script src="../assets/pages/period-review/leaf-board.js?v=20261002a"></script><script src="../assets/period-review-live.js?v=20261002a"></script>
</body>
</html>
