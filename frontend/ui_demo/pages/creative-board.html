<body data-page="creative-board">
  <div class="demo-app"><aside class="demo-sidebar" data-shell-sidebar></aside><div class="demo-main">
    <header class="demo-topbar" data-shell-header></header><main class="demo-page"><aside data-right-rail hidden aria-label="辅助信息"></aside>
      <div class="ui-page-header"><div><h1>素材点击率看板</h1><p>按单品沉淀全部历史素材表现；系统自动创意(智能创意/黑盒等)不在展示范围。</p></div></div>

      <section class="cb-summary" aria-label="素材总览">
        <article class="ui-metric-card"><div class="metric-card__label">单品数</div><div class="metric-card__value" data-cb-summary="products">--</div></article>
        <article class="ui-metric-card"><div class="metric-card__label">素材数</div><div class="metric-card__value" data-cb-summary="creatives">--</div></article>
        <article class="ui-metric-card"><div class="metric-card__label">累计花费</div><div class="metric-card__value" data-cb-summary="spend">--</div></article>
        <article class="ui-metric-card"><div class="metric-card__label">累计点击量</div><div class="metric-card__value" data-cb-summary="clicks">--</div></article>
      </section>

      <div class="cb-toolbar ui-filter-toolbar ui-table-toolbar" data-cb-categories><input class="input cb-search" data-cb-search placeholder="搜索商品 / ID" aria-label="搜索单品"></div>

      <section class="ui-panel cb-products-panel"><div class="panel__header cb-products-header"><div><h3 class="panel__title">单品列表</h3><p class="panel__hint">点击行查看该单品的素材表现</p></div><button class="ui-button" type="button" data-cb-columns-open><i data-lucide="settings-2"></i><span>列设置</span></button></div><div class="ui-table-wrap"><table class="ui-data-table cb-product-table"><thead><tr data-cb-table-head></tr></thead><tbody data-cb-products><tr><td colspan="8">加载中…</td></tr></tbody></table></div></section>
      <template data-cb-detail-template>
        <div class="modal-form__body cb-detail-dialog__body"><div class="cb-detail-summary" data-cb-detail-summary></div><div class="cb-detail-list" data-cb-detail-rows></div></div>
      </template>
      <dialog class="modal-form cb-image-dialog" data-cb-image-dialog data-modal-kind="detail" aria-labelledby="cb-image-title"><div class="modal-form__header"><h3 id="cb-image-title">素材预览</h3><button class="ui-button ui-button--ghost" type="button" data-cb-image-close aria-label="关闭图片预览"><i data-lucide="x"></i></button></div><div class="cb-image-dialog__body"><img data-cb-image-preview alt="素材预览"></div></dialog>
      <dialog class="modal-form ui-field-selector-dialog cb-columns-dialog" data-cb-columns-dialog data-modal-kind="config" aria-labelledby="cb-columns-title" hidden>
        <div class="modal-form__header"><div><h3 id="cb-columns-title">列设置</h3><p class="panel__hint">选择单品列表中需要展示的字段</p></div><button class="ui-button ui-button--ghost" type="button" data-cb-columns-close aria-label="关闭列设置"><i data-lucide="x"></i></button></div>
        <div class="modal-form__body"><div data-cb-field-selector></div><p class="modal-form__status" data-cb-columns-status></p></div>
        <div class="modal-form__footer"><button class="ui-button" type="button" data-cb-columns-close>取消</button><button class="ui-button ui-button--primary" type="button" data-cb-columns-apply><i data-lucide="check"></i>应用字段</button></div>
      </dialog>
    </main>
  </div></div>
