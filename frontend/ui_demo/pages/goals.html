<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>经营目标 | 天猫数据仪表盘</title><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/shell.css"><link rel="stylesheet" href="../assets/components.css"><script src="../assets/lucide-1.8.0.min.js"></script></head>
<body data-page="goals"><div class="demo-app"><aside class="demo-sidebar" data-shell-sidebar></aside><div class="demo-main"><header class="demo-topbar" data-shell-header></header><main class="demo-page">
<div class="demo-page__intro"><div><h2>经营目标</h2><p>年度目标拆解为日目标，年、季、月、周、日均从同一组原子目标聚合。</p></div></div>
<section class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">年度目标</h3><p class="panel__hint">可直接填写年度目标，或按去年净销售额乘增长倍率生成建议值。</p></div></div><form class="modal-form__body" data-goals-form><label>年份<input class="input" name="year" type="number" min="2000" max="2100" value="2026" required></label><label>增长倍率<input class="input" name="growth_multiplier" type="number" min="0.01" step="0.01" value="1.1" required></label><label>建议年度目标（元）<input class="input" name="suggested_annual_target" type="number" readonly aria-readonly="true"></label><label>年度目标（元）<input class="input" name="annual_target" type="number" min="0" step="0.01" required></label><button class="button button--ghost" type="button" data-goals-suggest>生成建议</button><button class="button button--primary" type="submit">生成或更新日目标</button><p data-goals-status role="status"></p></form></section>
<section class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">周期目标调整与锁定</h3><p class="panel__hint">支持年、季、月、周、日；锁定周期不会被后续重分配覆盖，所有调整写入审计。</p></div></div><form class="modal-form__body" data-goals-adjust-form><label>周期<select class="select" name="period_type"><option value="date">日</option><option value="week">周</option><option value="month" selected>月</option><option value="quarter">季</option><option value="year">年</option></select></label><label>目标周期<input class="input" name="period_key" data-goals-period-picker type="month" required></label><label>目标金额（元）<input class="input" name="target_amount" type="number" min="0" step="0.01" required></label><label>操作人<input class="input" name="operator" value="运营人员" required></label><label>调整原因<input class="input" name="reason" required></label><label><input type="checkbox" name="lock">锁定该周期</label><button class="button" type="submit">保存调整</button></form></section>
<section class="plain-panel panel"><div class="panel__header"><div><h3 class="panel__title">完成率与目标</h3><p class="panel__hint" data-goals-version>尚未加载</p></div><label>查看层级<select class="select" data-goals-level-filter><option value="year">年</option><option value="quarter">季</option><option value="month" selected>月</option><option value="week">周</option><option value="date">日</option></select></label></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>层级</th><th>周期键</th><th class="num">目标金额</th><th class="num">已完成金额</th><th class="num">完成率</th><th>锁定</th></tr></thead><tbody data-goals-levels><tr><td colspan="6">请选择年份</td></tr></tbody></table></div></section>
<section class="plain-panel panel"><div class="panel__header"><h3 class="panel__title">月度目标明细</h3></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>月份</th><th class="num">目标金额</th><th>锁定</th></tr></thead><tbody data-goals-months><tr><td colspan="3">请选择年份</td></tr></tbody></table></div></section>
</main></div></div><script src="../assets/api.js"></script><script src="../assets/shell.js"></script><script src="../assets/goals-live.js"></script></body></html>
<script src="../assets/navigation.js"></script>
