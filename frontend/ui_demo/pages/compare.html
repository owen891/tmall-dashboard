<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周期对比 | 天猫数据仪表盘</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/shell.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/lucide-1.8.0.min.js"></script>
  <script src="../assets/echarts-5.5.1.min.js"></script>
</head>
<body data-page="compare">
  <div class="demo-app">
    <aside class="demo-sidebar" data-shell-sidebar></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-shell-header></header>
      <main class="demo-page">
        <div class="demo-page__intro">
          <div><h2>周期对比</h2><p>选择两个自然月，对比核心指标与趋势差异。</p></div>
        </div>
        <section class="plain-panel panel">
          <div class="section-toolbar">
            <div class="filter-group">
              <label for="compare-a">本期<select class="select" id="compare-a" data-compare-a></select></label>
              <label for="compare-b">对比期<select class="select" id="compare-b" data-compare-b></select></label>
            </div>
            <button class="button button--primary" type="button" data-compare-run><i data-lucide="git-compare"></i><span>对比</span></button>
          </div>
          <div class="segmented" role="group" aria-label="趋势维度" data-compare-dimension>
            <button type="button" data-compare-metric="gmv" aria-pressed="true">GMV</button>
            <button type="button" data-compare-metric="visitors" aria-pressed="false">商品访客数</button>
            <button type="button" data-compare-metric="net_sales" aria-pressed="false">净销售</button>
          </div>
        </section>

        <section class="metric-grid" aria-label="对比指标">
          <article class="metric-card"><div class="metric-card__label">支付金额</div><div class="metric-card__value" data-compare-kpi="gmv">--</div><div class="metric-card__meta" data-compare-delta="gmv">--</div></article>
          <article class="metric-card"><div class="metric-card__label">商品访客数</div><div class="metric-card__value" data-compare-kpi="visitors">--</div><div class="metric-card__meta" data-compare-delta="visitors">--</div></article>
          <article class="metric-card"><div class="metric-card__label">退款率</div><div class="metric-card__value" data-compare-kpi="refund_rate">--</div><div class="metric-card__meta" data-compare-delta="refund_rate">--</div></article>
          <article class="metric-card"><div class="metric-card__label">客单价</div><div class="metric-card__value" data-compare-kpi="aov">--</div><div class="metric-card__meta" data-compare-delta="aov">--</div></article>
        </section>

        <section class="section-grid section-grid--wide">
          <article class="chart-panel panel">
            <div class="panel__header"><div><h3 class="panel__title">对应趋势</h3><p class="panel__hint" data-compare-periods>加载中</p></div></div>
            <div class="chart-box chart-box--tall"><div id="compareTrend" class="chart-canvas" role="img" aria-label="经营指标对比趋势"></div></div>
          </article>
          <article class="plain-panel panel">
            <div class="panel__header"><div><h3 class="panel__title">差异摘要</h3><p class="panel__hint">由 compare API 指标生成</p></div></div>
            <div class="status-list" data-compare-summary><div class="empty-state"><span>加载中</span></div></div>
          </article>
        </section>

        <section class="plain-panel panel">
          <div class="panel__header"><div><h3 class="panel__title">指标明细</h3><p class="panel__hint">本期 / 对比期 / change_pct / 判断</p></div></div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead><tr><th>指标</th><th class="num">本期</th><th class="num">对比期</th><th class="num">change_pct</th><th>判断</th></tr></thead>
              <tbody data-compare-body><tr><td colspan="5">加载中</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../assets/api.js"></script>
  <script src="../assets/charts.js"></script>
  <script src="../assets/shell.js"></script>
  <script src="../assets/compare-live.js"></script>
</body>
</html>
