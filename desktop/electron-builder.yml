appId: com.owen891.tmalldashboard
productName: 天猫数据仪表盘

directories:
  output: release

icon: assets/tmall-dashboard.ico

publish:
  provider: generic
  url: https://gitcode.com/owen891/tmall-dashboard/releases/latest/download

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../build/desktop/backend
    to: backend
    filter:
      - "**/*"
  # 托盘图标必须在运行时可读；打包器只把 icon 用于 exe/dmg 外壳，不会复制进包。
  - from: assets/tmall-dashboard.ico
    to: tray.ico
  - from: assets/tmall-dashboard-logo-1024.png
    to: tray.png

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "TmallDashboard-Setup-${version}-${arch}.${ext}"

mac:
  icon: assets/tmall-dashboard-logo-1024.png
  category: public.app-category.business
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: "TmallDashboard-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 天猫数据仪表盘
  language: "2052"
